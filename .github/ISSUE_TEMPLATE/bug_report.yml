name: Bug report
description: Report a bug — include reproduction so we can verify quickly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Remove secrets and private data from examples. For guardrail bypasses, use **Security → Report a vulnerability** instead."
  - type: input
    id: rule
    attributes:
      label: Rule ID, if applicable
      placeholder: "For example, SEC-01 or SUP-01"
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      placeholder: "Steps: git clone → bun install → … → expected vs actual"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: Describe the expected and actual verdict, and include a minimal redacted example if useful.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: "vibe-fence version, node -v, bun -v, OS, adapter (claude/cursor/hermes/...)"
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: "I ran `bun run validate` and `bunx tsc --noEmit`"
          required: false
