name: False positive
description: Report a safe action or code sample that a fence rule flagged.
labels: [bug, false-positive]
body:
  - type: markdown
    attributes:
      value: "Remove real tokens, credentials, personal data, and private source before posting. Report a bypass or vulnerability privately using the Security tab."
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: "For example, SEC-01 or SUP-01"
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Minimal redacted code or action
      description: Include the command and relevant file path, with secrets replaced by placeholders.
      render: text
    validations:
      required: true
  - type: textarea
    id: verdict
    attributes:
      label: Actual and expected verdicts
      description: Include the reported rule and why the action should be allowed.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "vibe-fence version, OS, Node version, and host"
    validations:
      required: true
