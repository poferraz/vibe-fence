name: release

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: bun install --frozen-lockfile
      - run: bunx --no-install tsc --noEmit
      - run: bun run build
      - run: bun run validate
      - run: bun test
        if: runner.os != 'Windows'
      - run: bun test tests/portable-smoke.test.ts
        if: runner.os == 'Windows'
      - run: bun run eval
      - run: bun pm pack --dry-run
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          # npm trusted publishing requires npm >=11.5.1 and Node >=22.14.
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Check that the tag matches the package version
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"
      - run: bunx --no-install tsc --noEmit
      - run: bun run build
      - run: bun run validate
      - run: bun test
      - run: bun run eval
      - run: bun pm pack --dry-run
      # Uses npm trusted publishing (OIDC) or NPM_TOKEN with provenance.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
