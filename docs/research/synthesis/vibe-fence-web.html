<title>Meta Vibe-Fence — Everything is a Plugin (Web UI on :3100)</title>
<style>
  :root{
    --bg:#060612;--soft:#101025;--surf:#161632;--line:#1e1e3a;
    --blue:#4f6cf7;--cyan:#22d3ee;--violet:#a78bfa;--amber:#fbbf24;--rose:#fb7185;--emerald:#34d399;--slate:#94a3b8;--ink:#e2e8f0;
  }
  *{box-sizing:border-box;margin:0}
  body{font:13px/1.5 "JetBrains Mono",ui-monospace,monospace;background:radial-gradient(900px 500px at 30% 0%,#1a1a55 0%,#060612 55%),var(--bg);color:var(--ink);min-height:100vh}
  header{max-width:1120px;margin:0 auto;padding:18px 20px 8px;display:flex;align-items:center;gap:12px}
  header h1{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
  header .dot{width:8px;height:8px;border-radius:999px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
  header small{margin-left:auto;color:var(--slate);font-size:11px}
  .wrap{max-width:1120px;margin:8px auto 28px;padding:0 16px}
  .card{background:rgba(22,22,60,.65);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(12px);overflow:hidden}
  .svgWrap{padding:12px}
  svg{display:block;width:100%;height:auto}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
  .info{background:rgba(22,22,60,.5);border:1px solid var(--line);border-radius:12px;padding:12px}
  .info h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
  .info h3.cyan{color:var(--cyan)} .info h3.violet{color:var(--violet)} .info h3.amber{color:var(--amber)}
  .info li{color:var(--slate);font-size:11px;line-height:1.6;list-style:none}
  footer{max-width:1120px;margin:12px auto 20px;padding:0 20px;color:var(--slate);font-size:10px}
</style>
