# src/adapters/claude.yml — Claude Code runtime profile (REFERENCE override)
# Authority: src/adapters/types.ts (inline ADAPTERS array is canonical per GEM-03).
# This YML is a data mirror for tooling/inspection; types.ts remains the single source of truth.
# Spec: FINAL-v4 S-02 (Skills), S-03 (Context budget).
# Linked budget: src/framework/context-budget.yml — adapters override total_tokens per-runtime.

name: claude-code
label: Claude Code
runtime: claude-code

# Context window — Claude Sonnet 4.5 / Opus 4.1 effective window (S-03).
# Budget buckets in context-budget.yml are scaled against this window.
window:
  total_tokens: 200000
  note: "Claude effective window; S-03 caps (static/dynamic/history/headroom) scale against this"

skillsDir: ~/.claude/skills
agentsMapping:
  canonical: AGENTS.md
  runtimePaths:
    - AGENTS.md
    - .agents/AGENTS.md
    - MEMORY.md
  precedence: "project-over-user, deeper-over-shallower (host instruction precedence)"

hookSurface:
  hooks:
    - PreToolUse
    - PostToolUse
  fpBudgetNotes: "Minimal PreToolUse/PostToolUse only — FP budget defines surface (S-10/C-01)"
