# src/adapters/cursor.yml — Cursor runtime profile (REFERENCE override)
# Authority: src/adapters/types.ts (inline ADAPTERS array is canonical per GEM-03).
# This YML is a data mirror for tooling/inspection; types.ts remains the single source of truth.
# Spec: FINAL-v4 S-02 (Skills), S-03 (Context budget), S-13 (Muse routing), C-03 (ACI by model tier).
# Linked budget: src/framework/context-budget.yml — adapters override total_tokens per-runtime.

name: cursor
label: Cursor
runtime: cursor

window:
  total_tokens: 128000
  note: "Cursor default window; S-03 caps (static/dynamic/history/headroom) scale against this"

skillsDir: ~/.cursor/skills
agentsMapping:
  canonical: AGENTS.md
  runtimePaths:
    - .cursor/rules
    - .cursorrules
    - AGENTS.md
  precedence: "AGENTS.md canonical; .cursor/rules/*.mdc as Cursor-native mirrors"

hookSurface:
  hooks:
    - PreToolUse
    - PostToolUse
  fpBudgetNotes: "Minimal hooks — Cursor .cursor/hooks.json; FP budget per S-10/C-01"

# C-03: Cursor typically runs frontier models (GPT-5 / Claude) — thin surface;
# on weaker local models Cursor can spawn, richer surface is justified.
modelHint:
  tier: frontier
  surface: thin
  description: "Cursor with frontier model: thin hooks suffice; on weak/local fallback use richer filtered tools per C-03"
  fallback: "Weak-tier Cursor session: expand hookSurface with additional validation hooks"
