# src/adapters/hermes.yml — Hermes Agent runtime profile (REFERENCE override)
# Authority: src/adapters/types.ts (inline ADAPTERS array is canonical per GEM-03).
# This YML is a data mirror for tooling/inspection; types.ts remains the single source of truth.
# Spec: FINAL-v4 S-02 (Skills), S-03 (Context budget).
# Linked budget: src/framework/context-budget.yml — adapters override total_tokens per-runtime.

name: hermes
label: Hermes Agent
runtime: hermes

window:
  total_tokens: 128000
  note: "Hermes default window; S-03 caps (static/dynamic/history/headroom) scale against this"

skillsDir: ~/.hermes/skills
agentsMapping:
  canonical: AGENTS.md
  runtimePaths:
    - AGENTS.md
    - .hermes/AGENTS.md
  precedence: "AGENTS.md canonical; .hermes/AGENTS.md project-local overrides"

hookSurface:
  hooks:
    - PreToolUse
    - PostToolUse
  fpBudgetNotes: "Minimal — PreToolUse/PostToolUse; FP budget per S-10/C-01"
